[project]
name = "resumefit-backend"
version = "0.1.0"
description = "ResumeFit API - resume parsing and ATS-readiness foundation (Phase 1)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
